<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Song of Ice and Fire Encyclopedia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a1a;
            --secondary: #2d2d2d;
            --gold: #c9a961;
            --silver: #e8e8e8;
            --accent: #8b0000;
            --text: #e8e8e8;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: var(--text);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid var(--gold);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--silver);
            font-style: italic;
        }

        .search-bar {
            margin: 30px 0;
            display: flex;
            gap: 10px;
        }

        #searchInput {
            flex: 1;
            padding: 15px;
            background: var(--secondary);
            border: 2px solid var(--gold);
            border-radius: 5px;
            color: var(--text);
            font-size: 1rem;
            font-family: 'Georgia', serif;
        }

        #searchInput::placeholder {
            color: #888;
        }

        .filter-section {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: var(--secondary);
            border: 2px solid var(--gold);
            color: var(--gold);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--gold);
            color: var(--primary);
            font-weight: bold;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: var(--secondary);
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(201, 169, 97, 0.3);
            border-color: var(--accent);
        }

        .card-type {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .card p {
            color: var(--silver);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .card-meta {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--gold);
            font-size: 0.85rem;
            color: var(--gold);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--secondary);
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: var(--gold);
            color: var(--primary);
        }

        .modal h2 {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 15px;
        }

        .modal-section {
            margin: 20px 0;
        }

        .modal-section h3 {
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .modal-section p {
            color: var(--silver);
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--gold);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
            }

            .search-bar {
                flex-direction: column;
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: var(--secondary);
            border: 2px solid var(--gold);
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }

        .stat-box .number {
            font-size: 2rem;
            color: var(--gold);
            font-weight: bold;
        }

        .stat-box .label {
            color: var(--silver);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

        // Prepare data
        function prepareData() {
            data.characters.forEach(c => {
                c.type = 'character';
                c.searchText = (c.name + ' ' + c.house + ' ' + c.aliases.join(' ')).toLowerCase();
            });
            data.houses.forEach(h => {
                h.type = 'house';
                h.searchText = (h.name + ' ' + h.words + ' ' + h.seat).toLowerCase();
            });
            data.locations.forEach(l => {
                l.type = 'location';
                l.searchText = (l.name + ' ' + l.region).toLowerCase();
            });
            data.events.forEach(e => {
                e.type = 'event';
                e.searchText = (e.name + ' ' + e.description).toLowerCase();
            });

            allItems = [...data.characters, ...data.houses, ...data.locations, ...data.events];
        }

        // Update stats

            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-box">

                </div>

                </div>

                    <div class="number">${data.events.length}</div>
                    <div class="label">Events</div>
                </div>
            `;
        }

        // Render cards
        function renderCards(items) {
            const grid = document.getElementById('contentGrid');
            const noResults = document.getElementById('noResults');

            if (items.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            grid.innerHTML = items.map(item => createCard(item)).join('');
        }

        function createCard(item) {
            let preview = '';
            switch(item.type) {
                case 'character':
                    preview = `<p>${item.description}</p>
                              <div class="card-meta">House: ${item.house} | Status: ${item.status}</div>`;
                    break;
                case 'house':
                    preview = `<p>${item.description}</p>
                              <div class="card-meta">Seat: ${item.seat} | Words: "${item.words}"</div>`;
                    break;
                case 'location':
                    preview = `<p>${item.description}</p>
                              <div class="card-meta">Region: ${item.region}</div>`;
                    break;
                case 'event':
                    preview = `<p>${item.description}</p>
                              <div class="card-meta">Year: ${item.year}</div>`;
                    break;
            }

            return `
                <div class="card" onclick="openModal('${item.name.replace(/'/g, "\\'")}')">
                    <span class="card-type">${item.type}</span>
                    <h3>${item.name}</h3>
                    ${preview}
                </div>
            `;
        }

        function openModal(name) {
            const item = allItems.find(i => i.name === name);
            if (!item) return;

            let content = `<h2>${item.name}</h2>`;

            if (item.type === 'character') {
                content += `
                    <div class="modal-section">
                        <h3>House</h3>
                        <p>${item.house}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Description</h3>
                        <p>${item.description}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Titles & Aliases</h3>
                        <p>${item.aliases.join(', ')}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Status</h3>
                        <p>${item.status}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Appears In</h3>
                        <p>${item.books.join(', ')}</p>
                    </div>
                `;
            } else if (item.type === 'house') {
                content += `
                    <div class="modal-section">
                        <h3>Sigil</h3>
                        <p>${item.sigil}</p>
                    </div>
                    <div class="modal-section">

                        <p>"${item.words}"</p>
                    </div>
                    <div class="modal-section">

                        <p>${item.seat}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Region</h3>
                        <p>${item.region}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Description</h3>
                        <p>${item.description}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Notable Members</h3>
                        <p>${item.notableMumbers.join(', ')}</p>
                    </div>
                `;
            } else if (item.type === 'location') {
                content += `
                    <div class="modal-section">
                        <h3>Region</h3>
                        <p>${item.region}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Description</h3>
                        <p>${item.description}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Significance</h3>
                        <p>${item.significance}</p>
                    </div>
                `;
            } else if (item.type === 'event') {
                content += `
                    <div class="modal-section">
                        <h3>Year</h3>
                        <p>${item.year}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Description</h3>
                        <p>${item.description}</p>
                    </div>
                    <div class="modal-section">
                        <h3>Significance</h3>
                        <p>${item.significance}</p>
                    </div>
                `;
            }

            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Search & Filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allItems.filter(item => {
                const matchesSearch = item.searchText.includes(query);
                const matchesFilter = currentFilter === 'all' || item.type === currentFilter;
                return matchesSearch && matchesFilter;
            });
            renderCards(filtered);
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;

                const query = document.getElementById('searchInput').value.toLowerCase();
                const filtered = allItems.filter(item => {
                    const matchesSearch = item.searchText.includes(query);
                    const matchesFilter = currentFilter === 'all' || item.type === currentFilter;
                    return matchesSearch && matchesFilter;
                });
                renderCards(filtered);
            });
        });

        // Modal close on background click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Initialize
        prepareData();
        updateStats();
        renderCards(allItems);
    </script>
</body>
</html>
