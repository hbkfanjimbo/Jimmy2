<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breathing-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.8;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 30% 30%, #ff006e, #8338ec);
            top: 20%;
            left: 10%;
            animation: breathe 6s ease-in-out infinite;
        }

        .orb-2 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle at 70% 70%, #3a86ff, #06ffa5);
            bottom: 20%;
            right: 10%;
            animation: breathe 7s ease-in-out infinite;
            animation-delay: 1s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle at 50% 50%, #ffbe0b, #fb5607);
            top: 50%;
            right: 5%;
            animation: breathe 8s ease-in-out infinite;
            animation-delay: 0.5s;
        }

        .orb-4 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle at 40% 60%, #8338ec, #ff006e);
            bottom: 10%;
            left: 20%;
            animation: breathe 5.5s ease-in-out infinite;
            animation-delay: 2s;
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.9;
            }
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                rgba(10, 10, 10, 0.3) 0%,
                rgba(20, 10, 30, 0.5) 50%,
                rgba(10, 20, 40, 0.3) 100%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.8;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }

        .color-selector {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .color-btn:hover {
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .color-btn.active {
            border-color: rgba(255, 255, 255, 1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .btn-purple {
            background: linear-gradient(135deg, #8338ec, #ff006e);
        }

        .btn-blue {
            background: linear-gradient(135deg, #3a86ff, #06ffa5);
        }

        .btn-orange {
            background: linear-gradient(135deg, #ffbe0b, #fb5607);
        }

        .btn-pink {
            background: linear-gradient(135deg, #ff006e, #fb5607);
        }

        .btn-teal {
            background: linear-gradient(135deg, #06ffa5, #3a86ff);
        }

        @media (max-height: 600px) {
            h1 {
                font-size: 1.8rem;
                margin-bottom: 0.5rem;
            }
            .subtitle {
                font-size: 0.8rem;
            }
            .color-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="breathing-orb orb-1"></div>
        <div class="breathing-orb orb-2"></div>
        <div class="breathing-orb orb-3"></div>
        <div class="breathing-orb orb-4"></div>
        <div class="gradient-overlay"></div>

        <div class="content">
            <h1>BREATHE</h1>
            <p class="subtitle">Find Your Calm</p>
            <div class="color-selector">
                <button class="color-btn btn-purple active" onclick="setTheme('purple')"></button>
                <button class="color-btn btn-blue" onclick="setTheme('blue')"></button>
                <button class="color-btn btn-orange" onclick="setTheme('orange')"></button>
                <button class="color-btn btn-pink" onclick="setTheme('pink')"></button>
                <button class="color-btn btn-teal" onclick="setTheme('teal')"></button>
            </div>
        </div>
    </div>

    <script>
        const themes = {
            purple: {
                orb1: 'radial-gradient(circle at 30% 30%, #ff006e, #8338ec)',
                orb2: 'radial-gradient(circle at 70% 70%, #8338ec, #ff006e)',
                orb3: 'radial-gradient(circle at 50% 50%, #b22d5b, #6a0572)',
                orb4: 'radial-gradient(circle at 40% 60%, #8338ec, #ff006e)'
            },
            blue: {
                orb1: 'radial-gradient(circle at 30% 30%, #3a86ff, #06ffa5)',
                orb2: 'radial-gradient(circle at 70% 70%, #06ffa5, #3a86ff)',
                orb3: 'radial-gradient(circle at 50% 50%, #1b5e9e, #03d9a3)',
                orb4: 'radial-gradient(circle at 40% 60%, #06ffa5, #3a86ff)'
            },
            orange: {
                orb1: 'radial-gradient(circle at 30% 30%, #ffbe0b, #fb5607)',
                orb2: 'radial-gradient(circle at 70% 70%, #fb5607, #ffbe0b)',
                orb3: 'radial-gradient(circle at 50% 50%, #d4860f, #c93a02)',
                orb4: 'radial-gradient(circle at 40% 60%, #fb5607, #ffbe0b)'
            },
            pink: {
                orb1: 'radial-gradient(circle at 30% 30%, #ff006e, #fb5607)',
                orb2: 'radial-gradient(circle at 70% 70%, #fb5607, #ff006e)',
                orb3: 'radial-gradient(circle at 50% 50%, #d4004b, #c93a02)',
                orb4: 'radial-gradient(circle at 40% 60%, #ff006e, #fb5607)'
            },
            teal: {
                orb1: 'radial-gradient(circle at 30% 30%, #06ffa5, #3a86ff)',
                orb2: 'radial-gradient(circle at 70% 70%, #3a86ff, #06ffa5)',
                orb3: 'radial-gradient(circle at 50% 50%, #03d9a3, #1b5e9e)',
                orb4: 'radial-gradient(circle at 40% 60%, #06ffa5, #3a86ff)'
            }
        };

        function setTheme(themeName) {
            const theme = themes[themeName];
            const orbs = document.querySelectorAll('.breathing-orb');
            orbs[0].style.background = theme.orb1;
            orbs[1].style.background = theme.orb2;
            orbs[2].style.background = theme.orb3;
            orbs[3].style.background = theme.orb4;

            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            localStorage.setItem('breathingTheme', themeName);
        }

        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem('breathingTheme') || 'purple';
            const btn = document.querySelector(`.btn-${savedTheme}`);
            if (btn) setTheme(savedTheme);
        });
    </script>
</body>
</html>
